name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Upstream publishes no tags; pinned to master as of 2026-10-07
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  hacs:
    runs-on: ubuntu-latest
    steps:
      # Upstream publishes no tags; pinned to main as of 2026-10-07
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: brands
